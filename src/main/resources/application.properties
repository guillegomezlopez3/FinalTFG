# ===========================
# APPLICATION
# ===========================
spring.application.name=TFGFitApp
# ===========================
# DATABASE - MySQL
# ===========================
spring.datasource.url=jdbc:mysql://localhost:3306/personal_trainer_manager?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=Pipas1372.
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# ===========================
# JPA / HIBERNATE
# ===========================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
# ===========================
# JWT
# ===========================
# Clave secreta Base64 (minimo 256 bits para HS256)
# Genera una con: openssl rand -base64 64
app.jwt.secret=ZnRnZml0YXBwLXNlY3JldC1rZXktcXVlLWRlYmUtc2VyLW11eS1sYXJnYS15LXNlZ3VyYS0yMDI0
app.jwt.expiration=86400000
# ===========================
# SERVER
# ===========================
server.port=8081
# ===========================
# THYMELEAF
# ===========================
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.cache=false
