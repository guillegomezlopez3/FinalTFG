# ===========================
# APPLICATION
# ===========================
spring.application.name=TFGFitApp
server.port=${PORT:8080}

# ===========================
# DATABASE - MySQL
# ===========================
# Usa variables de entorno para no exponer credenciales reales
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/tfgfitapp?serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===========================
# JPA / HIBERNATE
# ===========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ===========================
# JWT
# ===========================
app.jwt.secret=${JWT_SECRET:cambiar_esta_clave_secreta_en_produccion_123456789}
app.jwt.expiration=86400000

# ===========================
# THYMELEAF
# ===========================
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.cache=false

# ===========================
# ADMIN DEFAULT (DataInitializer)
# ===========================
app.admin.email=${ADMIN_EMAIL:admin@tfgfitapp.com}
app.admin.password=${ADMIN_PASSWORD:Admin1234!}
app.admin.name=Administrador

# ===========================
# EMAIL CONFIGURATION (Brevo / SMTP)
# ===========================
app.email.enabled=true
app.base-url=${APP_BASE_URL:https://finaltfglevelup.onrender.com}

app.email.sender=${EMAIL_SENDER:tu-email@dominio.com}
spring.mail.host=${SMTP_HOST:smtp-relay.brevo.com}
spring.mail.port=${SMTP_PORT:2525}
spring.mail.username=${SMTP_USERNAME:tu_usuario_smtp}
spring.mail.password=${SMTP_PASSWORD:tu_password_smtp}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# ===========================
# STRIPE CONFIGURATION
# ===========================
stripe.api.key=${STRIPE_API_KEY:sk_test_placeholder}
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET:whsec_placeholder}
stripe.price.trainer-annual=${STRIPE_PRICE_TRAINER:price_placeholder}
stripe.price.client-monthly=${STRIPE_PRICE_CLIENT:price_placeholder}
app.trial.days=10
