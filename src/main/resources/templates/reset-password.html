<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <th:block th:replace="~{fragments/head :: head(title='Establecer nueva Contraseña')}"/>
</head>
<body>
<div class="auth-wrapper">

    <!-- LADO IZQUIERDO: hero deportivo -->
    <div class="auth-hero">
        <div class="auth-hero-content">
            <div class="hero-badge mb-4">
                <i class="bi bi-shield-lock-fill"></i> Seguridad
            </div>
            <h1>Recuperación<br><span>completada.</span></h1>
            <p>Introduce tu nueva contraseña. Asegúrate de escoger una contraseña segura de al menos 6 caracteres.</p>
        </div>
    </div>

    <!-- LADO DERECHO: formulario -->
    <div class="auth-form-side">
        <div class="auth-form-inner fade-in-up">
            <div class="auth-logo">
                <i class="bi bi-activity"></i> TFG<span>Fit</span>App
            </div>
            <h2>Nueva Contraseña</h2>
            <p class="subtitle">Escribe tu nueva credencial de acceso</p>

            <div id="alert-box"></div>

            <form id="reset-password-form" novalidate>
                <input type="hidden" id="token" name="token">
                <div class="mb-4">
                    <label class="form-label">Nueva Contraseña</label>
                    <div style="position:relative;">
                        <input type="password" id="newPassword" class="form-control pe-5" placeholder="••••••••" required autocomplete="new-password"/>
                        <button type="button" onclick="togglePass()" style="position:absolute;right:.75rem;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--text-muted);">
                            <i class="bi bi-eye" id="eye-icon"></i>
                        </button>
                    </div>
                </div>
                <button type="submit" class="btn-auth" id="btn-submit">
                    <span id="btn-text">Cambiar Contraseña</span>
                    <span id="btn-spinner" class="spinner-border spinner-border-sm ms-2 d-none" role="status"></span>
                </button>
            </form>

            <p class="text-center mt-4 text-muted" style="font-size:.88rem;">
                Volver a
                <a href="/login" style="color:var(--orange);font-weight:600;">Iniciar sesión</a>
            </p>
        </div>
    </div>
</div>

<script th:src="@{/webjars/bootstrap/js/bootstrap.bundle.min.js}"></script>
<script th:src="@{/js/app.js}"></script>
<script>
    if (isLoggedIn()) window.location.href = '/dashboard';

    // Obtener el token de los Query Parameters (?token=...)
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token');

    if (!token) {
        document.getElementById('alert-box').innerHTML = '<div class="alert alert-danger">Error: Al enlace le falta el token de seguridad. Vuelva a solicitar el correo de recuperación.</div>';
        document.getElementById('btn-submit').disabled = true;
    } else {
        document.getElementById('token').value = token;
    }

    function togglePass() {
        const inp = document.getElementById('newPassword');
        const icon = document.getElementById('eye-icon');
        if (inp.type === 'password') {
            inp.type = 'text';
            icon.className = 'bi bi-eye-slash';
        } else {
            inp.type = 'password';
            icon.className = 'bi bi-eye';
        }
    }

    document.getElementById('reset-password-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const alertBox = document.getElementById('alert-box');
        const btn      = document.getElementById('btn-submit');
        const btnTxt   = document.getElementById('btn-text');
        const spinner  = document.getElementById('btn-spinner');

        const newPassword = document.getElementById('newPassword').value;

        if (!newPassword || newPassword.length < 6) {
            showAlert(alertBox, 'Por favor, introduce una contraseña válida (mínimo 6 caracteres).');
            return;
        }

        btn.disabled = true;
        btnTxt.textContent = 'Guardando...';
        spinner.classList.remove('d-none');
        alertBox.innerHTML = '';

        try {
            const res = await fetch('/api/auth/reset-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ token: token, newPassword: newPassword })
            });

            if (!res.ok) {
                const err = await res.json();
                throw new Error(err.error || 'Link expirado o inválido.');
            }

            const data = await res.json();
            showAlert(alertBox, 'Contraseña cambiada exitosamente. Serás redirigido al login en breve.', 'success');

            setTimeout(() => {
                window.location.href = '/login';
            }, 3500);

        } catch (err) {
            showAlert(alertBox, err.message);
            btn.disabled = false;
            btnTxt.textContent = 'Cambiar Contraseña';
            spinner.classList.add('d-none');
        }
    });
</script>
</body>
</html>
