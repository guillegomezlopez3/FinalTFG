<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <th:block th:replace="~{fragments/head :: head(title='Recuperar Contraseña')}"/>
</head>
<body>
<div class="auth-wrapper">

    <!-- LADO IZQUIERDO: hero deportivo -->
    <div class="auth-hero">
        <div class="auth-hero-content">
            <div class="hero-badge mb-4">
                <i class="bi bi-shield-lock-fill"></i> Seguridad
            </div>
            <h1>Recuperación<br><span>segura.</span></h1>
            <p>Introduce tu correo electrónico y te enviaremos un enlace para que puedas establecer una nueva contraseña de forma rápida y protegida.</p>
        </div>
    </div>

    <!-- LADO DERECHO: formulario -->
    <div class="auth-form-side">
        <div class="auth-form-inner fade-in-up">
            <div class="auth-logo">
                <i class="bi bi-activity"></i> TFG<span>Fit</span>App
            </div>
            <h2>¿Olvidaste tu contraseña?</h2>
            <p class="subtitle">Te enviaremos un enlace de recuperación.</p>

            <div id="alert-box"></div>

            <form id="forgot-password-form" novalidate>
                <div class="mb-4">
                    <label class="form-label">Correo electrónico</label>
                    <input type="email" id="email" class="form-control" placeholder="tu@email.com" required autocomplete="email"/>
                </div>
                <button type="submit" class="btn-auth" id="btn-submit">
                    <span id="btn-text">Enviar enlace</span>
                    <span id="btn-spinner" class="spinner-border spinner-border-sm ms-2 d-none" role="status"></span>
                </button>
            </form>

            <p class="text-center mt-4 text-muted" style="font-size:.88rem;">
                <a href="/login" style="color:var(--orange);font-weight:600;"><i class="bi bi-arrow-left"></i> Volver a Iniciar sesión</a>
            </p>
        </div>
    </div>
</div>

<script th:src="@{/webjars/bootstrap/js/bootstrap.bundle.min.js}"></script>
<script th:src="@{/js/app.js}"></script>
<script>
    if (isLoggedIn()) window.location.href = '/dashboard';

    document.getElementById('forgot-password-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const alertBox = document.getElementById('alert-box');
        const btn      = document.getElementById('btn-submit');
        const btnTxt   = document.getElementById('btn-text');
        const spinner  = document.getElementById('btn-spinner');

        const email = document.getElementById('email').value.trim();

        if (!email) {
            showAlert(alertBox, 'Por favor, introduce tu correo electrónico.');
            return;
        }

        btn.disabled = true;
        btnTxt.textContent = 'Enviando...';
        spinner.classList.remove('d-none');
        alertBox.innerHTML = '';

        try {
            const res = await fetch('/api/auth/forgot-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email })
            });

            if (!res.ok) {
                const err = await res.json();
                throw new Error(err.error || 'Error al solicitar el enlace.');
            }

            const data = await res.json();
            // Para simulación, mostramos el token si existe, en la vida real se esconde.
            if (data.token) {
                showAlert(alertBox, `Simulación: se enviaría un correo con tu enlace. <a href="/reset-password?token=${data.token}" style="font-weight:bold;text-decoration:underline;">[Haz clic aquí para usar el token generado]</a>`, 'info');
            } else {
                showAlert(alertBox, data.message || 'Si el correo existe, se enviará el enlace de recuperación (Check your email)', 'success');
            }

            btn.disabled = false;
            btnTxt.textContent = 'Enviar enlace';
            spinner.classList.add('d-none');
        } catch (err) {
            showAlert(alertBox, err.message);
            btn.disabled = false;
            btnTxt.textContent = 'Enviar enlace';
            spinner.classList.add('d-none');
        }
    });
</script>
</body>
</html>
