<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
<!--/*
  Fragmento: head
  Uso: <th:block th:replace="~{fragments/head :: head(title='Título')}"/>
*/-->
<th:block th:fragment="head(title)">
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title th:text="${title != null ? title + ' — LevelUp' : 'LevelUp'}">LevelUp</title>
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" th:href="@{/images/favicon.svg}"/>
    <!-- Bootstrap 5 CSS (WebJar) -->
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}"/>
    <!-- Bootstrap Icons (WebJar) -->
    <link rel="stylesheet" th:href="@{/webjars/bootstrap-icons/font/bootstrap-icons.css}"/>
    <!-- SweetAlert2 (Para alertas y popups más amigables) -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- Estilos propios -->
    <link rel="stylesheet" th:href="@{/css/app.css}"/>
    <!-- Script global -->
    <script th:src="@{/js/app.js}"></script>
</th:block>
</head>
<body></body>
</html>
