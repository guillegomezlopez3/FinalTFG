<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<!--/*
  Fragmento: sidebar
  Incluye la barra lateral de navegación del panel privado.
  Uso: <th:block th:replace="~{fragments/sidebar :: sidebar}"/>
  El JS de cada página marca como 'active' el enlace activo al cargar.
*/-->
<body>
<nav th:fragment="sidebar" class="sidebar">

    <a href="/dashboard" class="brand">
        <i class="bi bi-activity"></i>
        Level<span class="accent">Up</span>
    </a>

    <ul class="nav flex-column mt-1" id="sidebar-nav">

        <li class="nav-section">General</li>
        <li class="nav-item">
            <a class="nav-link" href="/dashboard" id="nav-dashboard">
                <i class="bi bi-grid-1x2-fill"></i> Inicio
            </a>
        </li>
        <li class="nav-item" id="nav-item-profile">
            <a class="nav-link" href="/dashboard/profile" id="nav-profile">
                <i class="bi bi-person-fill"></i> Mi Perfil
            </a>
        </li>
        <li class="nav-item" id="nav-item-chat">
            <a class="nav-link" href="/dashboard/chat" id="nav-chat">
                <i class="bi bi-chat-dots-fill"></i> Mensajes
            </a>
        </li>

        <li class="nav-section" id="section-trainer" style="display:none;">Gestión</li>
        <li class="nav-item" id="nav-item-clients" style="display:none;">
            <a class="nav-link" href="/dashboard/clients" id="nav-clients">
                <i class="bi bi-people-fill"></i> Clientes
            </a>
        </li>
        <li class="nav-item" id="nav-item-diets" style="display:none;">
            <a class="nav-link" href="/dashboard/diets" id="nav-diets">
                <i class="bi bi-egg-fried"></i> Dietas
            </a>
        </li>
        <li class="nav-item" id="nav-item-workouts" style="display:none;">
            <a class="nav-link" href="/dashboard/workouts" id="nav-workouts">
                <i class="bi bi-lightning-charge-fill"></i> Entrenamientos
            </a>
        </li>

        <li class="nav-section" id="section-client" style="display:none;">Mi Actividad</li>
        <li class="nav-item" id="nav-item-progress" style="display:none;">
            <a class="nav-link" href="/dashboard/progress" id="nav-progress">
                <i class="bi bi-graph-up-arrow"></i> Mi Progreso
            </a>
        </li>

        <li class="nav-section" id="section-admin" style="display:none;">Administración</li>
        <li class="nav-item" id="nav-item-admin" style="display:none;">
            <a class="nav-link" href="/dashboard/admin" id="nav-admin">
                <i class="bi bi-shield-fill-check"></i> Panel Admin
            </a>
        </li>
    </ul>

    <div class="sidebar-footer">
        <button class="btn-logout" onclick="logout()">
            <i class="bi bi-box-arrow-left"></i> Cerrar sesión
        </button>
    </div>
</nav>

<script>
(function() {
    async function initSidebar() {
        const path = window.location.pathname;
        document.querySelectorAll('.sidebar .nav-link').forEach(l => {
            if (l.getAttribute('href') === path) l.classList.add('active');
        });

        let user = getUser();
        
        // Si no hay usuario o faltan datos clave, y hay token, intentamos cargarlo
        const needsFetch = !user || !user.role || !user.name;
        if (needsFetch && isLoggedIn()) {
            try {
                user = await fetchCurrentUserProfile();
            } catch (e) {
                console.error('No se pudo cargar el perfil para el sidebar', e);
            }
        }

        // Si después de todo no hay usuario, redirigimos si no está logueado
        if (!user) {
            if (!isLoggedIn()) window.location.href = '/login';
            return;
        }

        const hide = id => { const el = document.getElementById(id); if(el) el.style.display='none'; };
        const show = id => { const el = document.getElementById(id); if(el) el.style.display='block'; };

        /* Ajustar visibilidad por rol */
        hide('section-trainer'); hide('nav-item-clients'); hide('nav-item-diets'); hide('nav-item-workouts');
        hide('section-client');  hide('nav-item-progress');
        hide('section-admin');   hide('nav-item-admin');

        if (user.role === 'CLIENT') {
            show('section-client');  show('nav-item-progress');
        } else if (user.role === 'TRAINER') {
            // Entrenadores ven su sección si tienen suscripción activa
            if (user.subscriptionActive) {
                show('section-trainer'); show('nav-item-clients');
                show('nav-item-diets');  show('nav-item-workouts');
            }
        } else if (user.role === 'ADMIN') {
            show('section-admin');   show('nav-item-admin');
        }
    }
    initSidebar();
})();
</script>
</body>
</html>
