<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <th:block th:replace="~{fragments/head :: head(title='Pago cancelado')}"/>
</head>
<body>
<div class="auth-wrapper d-flex justify-content-center align-items-center" style="min-height: 100vh; background: #f8f9fa;">
    <div class="card shadow-lg border-0" style="max-width: 500px; width: 100%; border-radius: 1rem;">
        <div class="card-body p-5 text-center fade-in-up">
            <i class="bi bi-exclamation-triangle-fill text-warning" style="font-size: 4rem;"></i>
            <h2 class="mt-4 mb-3">Pago cancelado</h2>
            <p class="text-muted mb-4">Has cancelado el proceso de pago de Stripe. Tu cuenta ha sido creada, pero necesitas completar el pago para acceder a todas las funcionalidades.</p>
            <div class="d-grid gap-2">
                <a href="/dashboard" class="btn btn-primary py-2" style="background: var(--orange); border: none; font-weight: 600;">Ir al Dashboard</a>
                <a href="/" class="btn btn-outline-secondary py-2" style="font-weight: 600;">Volver al inicio</a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
