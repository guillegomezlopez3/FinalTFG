<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <th:block th:replace="~{fragments/head :: head(title='Pago completado')}"/>
</head>
<body>
<div class="auth-wrapper d-flex justify-content-center align-items-center" style="min-height: 100vh; background: #f8f9fa;">
    <div class="card shadow-lg border-0" style="max-width: 500px; width: 100%; border-radius: 1rem;">
        <div class="card-body p-5 text-center fade-in-up">
            <i class="bi bi-check-circle-fill" style="font-size: 4rem; color: #10b981;"></i>
            <h2 class="mt-4 mb-3">¡Suscripción activada!</h2>
            <p class="text-muted mb-4">El proceso de pago se ha completado correctamente. Para comenzar a usar la plataforma, activa tu cuenta con el enlace enviado a tu correo electrónico.</p>
            <a href="/login" class="btn btn-primary px-4 py-2" style="background: var(--orange); border: none; font-weight: 600;">Ir al Inicio de Sesión</a>
        </div>
    </div>
</div>
<script th:src="@{/js/app.js}"></script>
<script>
    const user = getUser();
    if (user && user.email) {
        fetch('/api/stripe/activate-trainer-public', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: user.email })
        })
        .then(res => {
            if (res.ok) console.log('Suscripción activada localmente y correo enviado');
        })
        .catch(err => console.error('Error activando suscripción:', err));
    }

    // Limpiar sesión local ya que no puede acceder hasta confirmar correo
    clearSession();

    setTimeout(() => {
        window.location.href = '/login?payment_completed=true';
    }, 5000);
</script>
</body>
</html>
