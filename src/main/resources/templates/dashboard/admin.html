<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <th:block th:replace="~{fragments/head :: head(title='Administración')}"/>
</head>
<body>
<th:block th:replace="~{fragments/sidebar :: sidebar}"/>

<main class="main-content">
    <div class="topbar fade-in-up">
        <div class="topbar-left">
            <h4>Panel de Administración</h4>
            <p>Estadísticas globales y gestión de usuarios</p>
        </div>
    </div>

    <!-- STATS -->
    <div class="row g-3 mb-4 fade-in-up" id="stats-row">
        <div class="col-12 text-center py-3"><div class="spinner-border text-secondary"></div></div>
    </div>

    <div class="row g-3">
        <!-- ENTRENADORES -->
        <div class="col-lg-6 fade-in-up delay-1">
            <div class="card">
                <div class="card-header-custom">
                    <h5><i class="bi bi-person-workspace me-2" style="color:#3b82f6"></i>Entrenadores</h5>
                    <span class="text-muted" style="font-size:.82rem;" id="trainers-count"></span>
                </div>
                <div class="table-overflow">
                    <table class="table">
                        <thead><tr><th>Nombre</th><th>Email</th><th>Especialidad</th><th>Clientes</th><th>Estado / Acción</th></tr></thead>
                        <tbody id="trainers-body">
                            <tr><td colspan="5"><div class="text-center py-3"><div class="spinner-border spinner-border-sm text-secondary"></div></div></td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- CLIENTES -->
        <div class="col-lg-6 fade-in-up delay-2">
            <div class="card">
                <div class="card-header-custom">
                    <h5><i class="bi bi-people-fill me-2" style="color:#10b981"></i>Clientes recientes</h5>
                    <span class="text-muted" style="font-size:.82rem;" id="clients-count"></span>
                </div>
                <div class="table-overflow">
                    <table class="table">
                        <thead><tr><th>Nombre</th><th>Entrenador</th><th>Nivel</th><th>Estado</th><th>Acción</th></tr></thead>
                        <tbody id="clients-body">
                            <tr><td colspan="5"><div class="text-center py-3"><div class="spinner-border spinner-border-sm text-secondary"></div></div></td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- DIAGNÓSTICO DE EMAIL -->
    <div class="row g-3 mt-2">
        <div class="col-lg-6 fade-in-up delay-3">
            <div class="card">
                <div class="card-header-custom">
                    <h5><i class="bi bi-envelope-check-fill me-2" style="color:#FF7A00"></i>Diagnóstico de Email</h5>
                    <span class="badge" id="email-status-badge" style="background:var(--surface-2);color:var(--text-muted);font-size:.75rem;">Verificando...</span>
                </div>
                <div style="padding:1.25rem;">
                    <div id="email-config-info" class="mb-3" style="font-size:.82rem;color:var(--text-muted);"></div>
                    <div class="mb-3">
                        <label class="form-label" style="font-size:.85rem;font-weight:600;">Enviar email de prueba a:</label>
                        <div class="d-flex gap-2">
                            <input type="email" id="test-email-input" class="form-control" placeholder="tu@email.com" style="font-size:.85rem;"/>
                            <button class="btn btn-sm" id="btn-test-email" onclick="sendTestEmail()"
                                style="background:var(--orange);color:#fff;font-weight:600;white-space:nowrap;padding:.4rem 1rem;">
                                <i class="bi bi-send-fill me-1"></i>Probar
                            </button>
                        </div>
                    </div>
                    <div id="email-test-result"></div>
                </div>
            </div>
        </div>

        <div class="col-lg-6 fade-in-up delay-4">
            <div class="card">
                <div class="card-header-custom">
                    <h5><i class="bi bi-info-circle-fill me-2" style="color:#3b82f6"></i>Configuración SMTP</h5>
                </div>
                <div style="padding:1.25rem;" id="smtp-config-card">
                    <div class="text-center py-3"><div class="spinner-border spinner-border-sm text-secondary"></div></div>
                </div>
            </div>
        </div>
    </div>
</main>

<script th:src="@{/webjars/bootstrap/js/bootstrap.bundle.min.js}"></script>
<script th:src="@{/js/app.js}"></script>
<script>
requireAuth();

document.addEventListener('DOMContentLoaded', () => {
    loadStats();
    loadTrainers();
    loadClients();
});

async function loadStats() {
    try {
        const res  = await apiFetch('/admin/stats');
        const data = await res.json();
        document.getElementById('stats-row').innerHTML = `
            ${stat('bi-people-fill','orange', data.totalUsers, 'Usuarios totales')}
            ${stat('bi-person-workspace','blue', data.totalTrainers, 'Entrenadores')}
            ${stat('bi-people','green', data.totalClients, 'Clientes')}
            ${stat('bi-person-check-fill','teal', data.activeClients, 'Clientes activos')}
            ${stat('bi-egg-fried','purple', data.totalDiets, 'Dietas')}
            ${stat('bi-lightning-charge-fill','red', data.totalWorkoutPlans, 'Planes')}
        `;
    } catch(e) {
        document.getElementById('stats-row').innerHTML =
            `<div class="col-12 text-center text-muted py-2">Error al cargar estadísticas</div>`;
    }
}

function stat(icon, color, value, label) {
    return `
    <div class="col-sm-6 col-xl-4">
        <div class="stat-card">
            <div class="stat-icon ${color}"><i class="bi ${icon}"></i></div>
            <div class="stat-body"><div class="value">${value}</div><div class="label">${label}</div></div>
        </div>
    </div>`;
}

async function loadTrainers() {
    try {
        const res  = await apiFetch('/admin/trainers?size=20&sort=createdAt,desc');
        const data = await res.json();
        document.getElementById('trainers-count').textContent = `${data.totalElements} entrenadores`;
        const body = document.getElementById('trainers-body');
        if (!data.content || data.content.length === 0) {
            body.innerHTML = `<tr><td colspan="5"><div class="empty-state" style="padding:1.5rem;"><i class="bi bi-person-workspace"></i><p>Sin entrenadores</p></div></td></tr>`;
            return;
        }
        body.innerHTML = data.content.map(t => `
        <tr>
            <td>
                <div class="d-flex align-items-center gap-2">
                    ${getAvatarHtml(t.name, null, 'sm')}
                    <span style="font-weight:600;font-size:.88rem;">${t.name||'—'}</span>
                </div>
            </td>
            <td style="font-size:.82rem;">${t.email||'—'}</td>
            <td style="font-size:.82rem;">${t.specialty || '<span class="text-muted">—</span>'}</td>
            <td><span class="badge badge-trainer">${t.clientCount}</span></td>
            <td>
                <div class="d-flex align-items-center gap-2 flex-wrap">
                    ${t.active ? '<span class="badge badge-active">Activo</span>' : '<span class="badge badge-inactive">Inactivo</span>'}
                    <button
                        class="btn btn-xs ${t.active ? 'btn-outline-danger' : 'btn-outline-success'}"
                        style="font-size:.74rem;padding:.2rem .5rem;"
                        onclick="toggleActive(${t.userId}, this, ${t.active ? 'true' : 'false'})">
                        <i class="bi ${t.active ? 'bi-pause-circle' : 'bi-play-circle'}"></i>
                        ${t.active ? 'Desactivar' : 'Activar'}
                    </button>
                </div>
            </td>
        </tr>`).join('');
    } catch(e) {
        document.getElementById('trainers-body').innerHTML =
            `<tr><td colspan="5" class="text-center text-muted py-2">Error al cargar</td></tr>`;
    }
}

async function loadClients() {
    try {
        const res  = await apiFetch('/admin/clients?size=20&sort=createdAt,desc');
        const data = await res.json();
        document.getElementById('clients-count').textContent = `${data.totalElements} clientes`;
        const body = document.getElementById('clients-body');
        if (!data.content || data.content.length === 0) {
            body.innerHTML = `<tr><td colspan="5"><div class="empty-state" style="padding:1.5rem;"><i class="bi bi-people"></i><p>Sin clientes</p></div></td></tr>`;
            return;
        }
        const levelMap = { BEGINNER:'Principiante', INTERMEDIATE:'Intermedio', ADVANCED:'Avanzado' };
        const levelCls = { BEGINNER:'badge-beginner', INTERMEDIATE:'badge-intermediate', ADVANCED:'badge-advanced' };
        body.innerHTML = data.content.map(c => `
        <tr>
            <td>
                <div class="d-flex align-items-center gap-2">
                    ${getAvatarHtml(c.userName, null, 'sm')}
                    <div>
                        <div style="font-weight:600;font-size:.88rem;">${c.userName||'—'}</div>
                        <div style="font-size:.76rem;color:var(--text-muted);">${c.userEmail||''}</div>
                    </div>
                </div>
            </td>
            <td style="font-size:.82rem;">${c.trainerName||'<span class="text-muted">Sin asignar</span>'}</td>
            <td>${c.level ? `<span class="badge ${levelCls[c.level]||''}">${levelMap[c.level]||c.level}</span>` : '<span class="text-muted">—</span>'}</td>
            <td>${c.active ? '<span class="badge badge-active">Activo</span>' : '<span class="badge badge-inactive">Inactivo</span>'}</td>
            <td>
                <button
                    class="btn btn-xs ${c.active ? 'btn-outline-danger' : 'btn-outline-success'}"
                    style="font-size:.74rem;padding:.2rem .5rem;"
                    onclick="toggleActive(${c.userId}, this, ${c.active ? 'true' : 'false'})">
                    <i class="bi ${c.active ? 'bi-pause-circle' : 'bi-play-circle'}"></i>
                    ${c.active ? 'Desactivar' : 'Activar'}
                </button>
            </td>
        </tr>`).join('');
    } catch(e) {
        document.getElementById('clients-body').innerHTML =
            `<tr><td colspan="5" class="text-center text-muted py-2">Error al cargar</td></tr>`;
    }
}

async function toggleActive(userId, btn, currentState) {
    const oldHtml = btn.innerHTML;
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span>';

    try {
        const res = await apiFetch(`/admin/users/${userId}/active`, { method:'PUT' });
        if (!res.ok) throw new Error();
        setTimeout(() => {
            loadTrainers();
            loadClients();
        }, 300);
    } catch(e) {
        btn.disabled = false;
        btn.innerHTML = oldHtml;
        const actionText = currentState ? 'desactivar' : 'activar';
        alert(`No se pudo ${actionText} el usuario.`);
    }
}

// --- DIAGNÓSTICO DE EMAIL ---
async function loadEmailConfig() {
    try {
        const res = await apiFetch('/admin/email/config');
        if(!res.ok) return;
        const data = await res.json();
        
        const badge = document.getElementById('email-status-badge');
        badge.textContent = data.emailEnabled ? 'Activo' : 'Desactivado';
        badge.style.background = data.emailEnabled ? '#dcfce7' : '#fee2e2';
        badge.style.color = data.emailEnabled ? '#166534' : '#991b1b';

        document.getElementById('email-config-info').innerHTML = 
            `Enviando como: <strong>${data.config.from}</strong> a través de <strong>${data.config.host}:${data.config.port}</strong>`;

        document.getElementById('smtp-config-card').innerHTML = `
            <div class="d-flex justify-content-between mb-2 pb-2 border-bottom">
                <span class="text-muted" style="font-size:.85rem;">Servidor SMTP</span>
                <span style="font-size:.85rem;font-weight:600;">${data.config.host}</span>
            </div>
            <div class="d-flex justify-content-between mb-2 pb-2 border-bottom">
                <span class="text-muted" style="font-size:.85rem;">Puerto</span>
                <span style="font-size:.85rem;font-weight:600;">${data.config.port}</span>
            </div>
            <div class="d-flex justify-content-between mb-2 pb-2 border-bottom">
                <span class="text-muted" style="font-size:.85rem;">Remitente</span>
                <span style="font-size:.85rem;font-weight:600;">${data.config.from}</span>
            </div>
            <div class="d-flex justify-content-between">
                <span class="text-muted" style="font-size:.85rem;">URL Base (Enlaces)</span>
                <span style="font-size:.85rem;font-weight:600;color:var(--primary);">${data.config.baseUrl}</span>
            </div>
        `;
    } catch(e) {
        document.getElementById('smtp-config-card').innerHTML = `<div class="text-danger" style="font-size:.85rem;">Error cargando configuración</div>`;
    }
}

async function sendTestEmail() {
    const email = document.getElementById('test-email-input').value;
    if(!email) { alert('Introduce un email'); return; }
    
    const btn = document.getElementById('btn-test-email');
    const resDiv = document.getElementById('email-test-result');
    
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span>';
    resDiv.innerHTML = '';

    try {
        const res = await apiFetch('/admin/email/test', {
            method: 'POST',
            body: JSON.stringify({ email })
        });
        const data = await res.json();
        
        if(data.success) {
            resDiv.innerHTML = `<div class="alert alert-success mt-3" style="padding:.75rem;font-size:.85rem;margin-bottom:0;"><i class="bi bi-check-circle-fill me-2"></i>${data.message} (${data.elapsedMs}ms)</div>`;
        } else {
            let troubleHtml = '';
            if(data.troubleshooting) {
                troubleHtml = '<ul class="mt-2 mb-0 ps-3 text-start" style="font-size:.8rem;">' + 
                    Object.values(data.troubleshooting).map(t => `<li>${t}</li>`).join('') + '</ul>';
            }
            resDiv.innerHTML = `<div class="alert alert-danger mt-3" style="padding:.75rem;font-size:.85rem;margin-bottom:0;"><i class="bi bi-exclamation-triangle-fill me-2"></i><strong>Error:</strong> ${data.message}${troubleHtml}</div>`;
        }
    } catch(e) {
        resDiv.innerHTML = `<div class="alert alert-danger mt-3" style="padding:.75rem;font-size:.85rem;margin-bottom:0;"><i class="bi bi-exclamation-triangle-fill me-2"></i>Error de conexión</div>`;
    } finally {
        btn.disabled = false;
        btn.innerHTML = '<i class="bi bi-send-fill me-1"></i>Probar';
    }
}

// Hook into DOMContentLoaded
document.addEventListener('DOMContentLoaded', () => {
    loadEmailConfig();
});
</script>
</body>
</html>
